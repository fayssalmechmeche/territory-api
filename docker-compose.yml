services:
  db:
    image: postgis/postgis:16-3.4
    container_name: territory-db
    environment:
      POSTGRES_USER: territory_user
      POSTGRES_PASSWORD: territory_pass
      POSTGRES_DB: territory_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: territory-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: